<!DOCTYPE html>
<html>
<head><meta charset="UTF-8"><style>html,body{margin:0;padding:0;background:#000}</style></head>
<body>
<canvas id="cover"></canvas>
<script>
// Cover generator for Sky Stack — renders promo art at ?w=1920&h=1080 (&sq=1 for square)
const q = new URLSearchParams(location.search);
const W = parseInt(q.get('w') || '1920', 10);
const H = parseInt(q.get('h') || '1080', 10);
const canvas = document.getElementById('cover');
canvas.width = W; canvas.height = H;
const g = canvas.getContext('2d');
const square = q.get('sq') === '1';
const sq = H / 1080;

// sky gradient: day at bottom → space at top
const bg = g.createLinearGradient(0, 0, 0, H);
bg.addColorStop(0, '#08102a'); bg.addColorStop(0.45, '#2a5aa8'); bg.addColorStop(1, '#8ec8f2');
g.fillStyle = bg; g.fillRect(0, 0, W, H);

// stars up top
let seed = 7;
function rnd(){seed=(seed*1103515245+12345)%2147483648;return seed/2147483648;}
for (let i = 0; i < 180; i++) {
  const x = rnd() * W, y = rnd() * H * 0.5, r = rnd() * 2 + 0.4;
  g.fillStyle = 'rgba(255,255,255,' + (0.25 + rnd() * 0.6) * (1 - y / (H * 0.55)) + ')';
  g.beginPath(); g.arc(x, y, r, 0, Math.PI * 2); g.fill();
}

// clouds lower
g.fillStyle = 'rgba(255,255,255,0.30)';
[[0.12,0.82,150],[0.85,0.72,180],[0.3,0.92,130]].forEach(([fx,fy,r])=>{
  g.beginPath();
  g.ellipse(W*fx, H*fy, r*sq, r*0.3*sq, 0, 0, Math.PI*2);
  g.ellipse(W*fx+r*0.6*sq, H*fy+10*sq, r*0.7*sq, r*0.24*sq, 0, 0, Math.PI*2);
  g.fill();
});

// tower of rainbow blocks
function block(cx, y, w, h, hue, glow) {
  const x = cx - w / 2;
  if (glow) { g.shadowColor = 'hsla(' + hue + ',90%,70%,0.9)'; g.shadowBlur = 40 * sq; }
  const grad = g.createLinearGradient(x, y, x, y + h);
  grad.addColorStop(0, 'hsl(' + hue + ',72%,62%)');
  grad.addColorStop(1, 'hsl(' + hue + ',72%,44%)');
  g.fillStyle = grad; g.fillRect(x, y, w, h);
  g.shadowBlur = 0;
  g.fillStyle = 'rgba(255,255,255,0.22)'; g.fillRect(x, y, w, h * 0.14);
  g.fillStyle = 'rgba(0,0,0,0.18)'; g.fillRect(x, y + h * 0.86, w, h * 0.14);
}

const bh = 64 * sq;
const towerCx = square ? W * 0.5 : W * 0.72;
const n = square ? 9 : 12;
for (let i = 0; i < n; i++) {
  const hue = (i * 24) % 360;
  const w = (420 - i * 14) * sq;
  const jitter = Math.sin(i * 1.7) * 16 * sq;
  block(towerCx + jitter, H - (i + 1) * bh - (square ? H*0.06 : 0), w, bh, hue, false);
}
// moving glowing block at top
const topY = H - (n + 1) * bh - 26 * sq - (square ? H*0.06 : 0);
block(towerCx + (square ? 130 : 180) * sq, topY, (420 - n * 14) * sq, bh, (n * 24) % 360, true);
// debris falling
g.save();
g.translate(towerCx - 260 * sq, topY + 150 * sq); g.rotate(-0.5);
g.fillStyle = 'hsl(' + ((n - 1) * 24 % 360) + ',70%,50%)';
g.fillRect(0, 0, 110 * sq, bh * 0.8);
g.restore();

// title
g.textAlign = square ? 'center' : 'left';
g.textBaseline = 'middle';
g.shadowColor = 'rgba(120,200,255,0.9)'; g.shadowBlur = 34 * sq;
g.fillStyle = '#ffffff';
if (!square) {
  g.font = '900 ' + (170 * sq) + 'px "Segoe UI", Arial, sans-serif';
  g.fillText('SKY', W * 0.06, H * 0.30);
  g.fillText('STACK', W * 0.06, H * 0.47);
  g.shadowBlur = 0;
  g.fillStyle = 'rgba(255,255,255,0.9)';
  g.font = '600 ' + (48 * sq) + 'px "Segoe UI", Arial, sans-serif';
  g.fillText('Tap to drop. Stack to the stars.', W * 0.062, H * 0.60);
} else {
  g.font = '900 ' + (150 * sq) + 'px "Segoe UI", Arial, sans-serif';
  g.fillText('SKY', W * 0.5, H * 0.12);
  g.fillText('STACK', W * 0.5, H * 0.26);
  g.shadowBlur = 0;
}
document.title = 'ready';
</script>
</body>
</html>
